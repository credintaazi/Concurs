# FastAPI's Swagger UI loads its official distribution from jsDelivr and uses
# an inline bootstrap script. Keep this exception scoped to documentation.
map $uri $script_policy {
    default "'self'";
    /api/docs "'self' https://cdn.jsdelivr.net 'unsafe-inline'";
    /api/docs/oauth2-redirect "'self' 'unsafe-inline'";
}
map $uri $style_policy {
    default "'self' 'unsafe-inline'";
    /api/docs "'self' https://cdn.jsdelivr.net 'unsafe-inline'";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src $script_policy; style-src $style_policy; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
