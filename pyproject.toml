[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-platform"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "websockets>=14,<17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
